<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>悦美 · 价格查询系统</title>
<link rel="icon" href="logo" type="image/png">
<link rel="preload" href="logo" as="image" fetchpriority="high">
<link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">
<link rel="dns-prefetch" href="//cdn.sheetjs.com">
<meta property="og:title" content="悦美 · 价格查询系统">
<meta property="og:description" content="产品价格查询">
<meta property="og:image" content="https://yuemei.store/logo">
<meta property="og:url" content="https://yuemei.store/">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#E8A0B0;--rose-deep:#C97A90;--rose-light:#FDF0F3;--rose-mid:#F5D5DC;--gold:#C9A96E;--text:#1A1020;--text-sub:#9A8A8E;--border:#EDE0E3;--bg:#FBF7F8;--card:#FFFFFF;--up:#D4756A;--down:#5A9E78;--sidebar-w:88px;--header-h:68px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes qrZoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:linear-gradient(135deg,#fff8fa,#fff 70%);border-bottom:1px solid var(--rose-mid);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:200;box-shadow:0 2px 24px rgba(201,122,144,.1)}
.header-logo{display:flex;align-items:center;gap:12px}
.logo-emblem{width:42px;height:42px;border-radius:50%;overflow:hidden;box-shadow:0 4px 16px rgba(201,122,144,.38);flex-shrink:0}
.logo-emblem img{width:100%;height:100%;object-fit:cover;display:block}
.logo-info{display:flex;flex-direction:column}
.logo-name{font-size:17px;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,var(--rose-deep),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.logo-sub{font-size:10px;color:var(--text-sub);letter-spacing:1.5px;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.wechat-btn{position:relative;display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--rose-mid);border-radius:24px;padding:5px 13px 5px 6px;cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .25s;text-decoration:none}
.wechat-btn:hover{border-color:var(--rose);box-shadow:0 4px 14px rgba(201,122,144,.2);transform:translateY(-1px)}
.wechat-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;border:1.5px solid var(--rose-mid)}
.wechat-info{display:flex;flex-direction:column;line-height:1.2}
.wechat-label{font-size:9px;color:var(--text-sub);letter-spacing:.5px}
.wechat-id{font-size:12px;font-weight:700;color:var(--rose-deep);letter-spacing:.5px}
.wechat-popup{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid var(--rose-mid);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(201,122,144,.22);display:none;flex-direction:column;align-items:center;gap:10px;z-index:9000;white-space:nowrap;animation:fadeInUp .2s ease;min-width:192px}
.wechat-popup.show{display:flex}
.wechat-popup .popup-qr{width:160px;height:160px;border-radius:12px;object-fit:cover;border:2px solid var(--rose-mid);cursor:zoom-in;transition:transform .2s;display:block}
.wechat-popup .popup-qr:hover{transform:scale(1.03)}
.wechat-popup-text{font-size:12px;color:var(--text-sub);text-align:center}
.wechat-popup-id{font-size:14px;font-weight:700;color:var(--rose-deep)}
.qr-modal{position:fixed;inset:0;background:rgba(26,16,32,.72);display:flex;align-items:center;justify-content:center;z-index:99999;animation:fadeIn .2s ease}
.qr-modal.hidden{display:none}
.qr-modal-inner{background:#fff;border-radius:22px;padding:28px 28px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 20px 60px rgba(201,122,144,.28);animation:qrZoomIn .25s ease;max-width:90vw}
.qr-modal-img{width:min(320px,80vw);height:min(320px,80vw);border-radius:16px;object-fit:cover;border:3px solid var(--rose-mid)}
.qr-modal-id{font-size:18px;font-weight:800;color:var(--rose-deep);letter-spacing:1px}
.qr-modal-tip{font-size:12px;color:var(--text-sub)}
.qr-modal-close{margin-top:4px;font-size:13px;font-weight:700;color:var(--rose-deep);background:var(--rose-light);border:1.5px solid var(--rose-mid);padding:8px 28px;border-radius:24px;cursor:pointer;transition:background .2s}
.qr-modal-close:hover{background:var(--rose-mid)}
.change-btn{font-size:12px;font-weight:700;color:var(--rose-deep);background:var(--rose-light);border:1.5px solid var(--rose-mid);padding:7px 15px;border-radius:24px;cursor:pointer;transition:background .25s,transform .25s;white-space:nowrap;letter-spacing:.5px}
.change-btn:hover{background:var(--rose-mid);transform:translateY(-1px)}
.change-btn.active{background:linear-gradient(135deg,var(--rose-deep),var(--gold));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(201,122,144,.42)}
.layout{display:flex;padding-top:var(--header-h);height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:12px 6px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sidebar-title{font-size:10px;letter-spacing:2px;color:var(--rose-deep);font-weight:800;text-align:center;padding:6px 0 12px;text-transform:uppercase}
.cat-btn{width:100%;padding:10px 5px;border:1.5px solid transparent;border-radius:12px;background:transparent;color:#6B5A60;font-size:12px;font-weight:600;cursor:pointer;transition:background .22s,color .22s,border-color .22s,transform .22s;text-align:center;line-height:1.4;word-break:break-all}
.cat-btn:hover{background:var(--rose-light);color:var(--rose-deep);border-color:var(--rose-mid);transform:translateX(2px)}
.cat-btn.active{background:linear-gradient(135deg,var(--rose-deep),var(--gold));color:#fff;font-weight:800;border-color:transparent;box-shadow:0 4px 14px rgba(201,122,144,.38)}
.cat-count{display:block;font-size:10px;margin-top:3px;opacity:.85;font-weight:700}
.cat-btn:not(.active) .cat-count{color:var(--rose-deep)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 14px;scrollbar-width:thin;scrollbar-color:var(--rose-mid) transparent}
.main-notice{text-align:center;font-size:11px;color:var(--text-sub);letter-spacing:1px;margin-bottom:10px}
.main-notice span{background:var(--rose-light);border:1px solid var(--rose-mid);border-radius:20px;padding:4px 14px;display:inline-block}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--rose);pointer-events:none}
.search-input{width:100%;padding:13px 16px 13px 44px;border:1.5px solid var(--border);border-radius:50px;font-size:14px;font-weight:500;background:#fff;color:var(--text);transition:border-color .25s,box-shadow .25s;outline:none;box-shadow:0 2px 12px rgba(201,122,144,.07);letter-spacing:.3px}
.search-input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,160,176,.16)}
.search-input::placeholder{color:#d0c0c5;font-weight:400}
.stats-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
.stats-count{font-size:13px;font-weight:600;color:var(--text-sub)}
.stats-count strong{color:var(--rose-deep);font-weight:800;font-size:15px}
.stats-pills{display:flex;gap:8px}
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px}
.pill-up{background:#fdf0ee;color:var(--up)}
.pill-down{background:#eef6f1;color:var(--down)}
.card-list{display:flex;flex-direction:column;gap:9px}
.price-card{background:var(--card);border-radius:16px;padding:15px 16px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:border-color .22s,box-shadow .22s,transform .22s;box-shadow:0 2px 10px rgba(201,122,144,.06);animation:fadeInUp .35s ease both}
.price-card.na,.data-table tbody tr.na{animation:none}
.price-card:hover{border-color:var(--rose);box-shadow:0 6px 20px rgba(201,122,144,.14);transform:translateY(-2px)}
.price-card:active{transform:scale(.982)}
.price-card.is-up{border-left:3px solid var(--up);background:linear-gradient(to right,#fff8f7,#fff)}
.price-card.is-down{border-left:3px solid var(--down);background:linear-gradient(to right,#f3faf6,#fff)}
.card-left{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;letter-spacing:.4px}
.card-bottom-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.card-spec{font-size:11px;color:var(--text-sub);background:var(--rose-light);display:inline-block;padding:3px 10px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:12px;flex-shrink:0}
.price-today{font-size:18px;font-weight:800;color:var(--text);letter-spacing:.5px}
.price-today.is-up{color:var(--up)}
.price-today.is-down{color:var(--down)}
.price-old{font-size:11px;color:#ccc;text-decoration:line-through}
.price-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.5px}
.price-tag.is-up{background:#fdf0ee;color:var(--up)}
.price-tag.is-down{background:#eef6f1;color:var(--down)}
.table-wrap{display:none;background:var(--card);border-radius:18px;border:1px solid var(--border);overflow:hidden;box-shadow:0 4px 28px rgba(201,122,144,.09)}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed}
.data-table thead tr{background:linear-gradient(135deg,#d4889a,#c9a96e)}
.data-table th{padding:16px 20px;text-align:left;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px}
.data-table th:nth-child(1){width:36%}
.data-table th:nth-child(2){width:24%}
.data-table th:nth-child(3){width:20%;text-align:right}
.data-table th:nth-child(4){width:20%;text-align:right}
.data-table tbody tr{border-bottom:1px solid var(--border);transition:background .18s,transform .18s;animation:rowIn .3s ease both}
.data-table tbody tr:last-child{border-bottom:none}
.data-table tbody tr:hover{background:var(--rose-light);transform:translateX(3px)}
.data-table td{padding:14px 20px;font-size:14px;vertical-align:middle}
.data-table td:nth-child(3),.data-table td:nth-child(4){text-align:right}
.td-name{font-weight:700;color:var(--text);font-size:14px;letter-spacing:.3px}
.td-spec{font-size:11px;color:var(--text-sub);background:var(--rose-light);padding:3px 10px;border-radius:20px;display:inline-block}
.td-yp{color:#ccc;font-size:13px;font-weight:500;text-decoration:line-through}
.td-tp{font-weight:800;font-size:15px;color:var(--text)}
.td-tp.is-up{color:var(--up)}
.td-tp.is-down{color:var(--down)}
.arrow-tag{font-size:10px;padding:2px 7px;border-radius:5px;margin-left:5px;font-weight:800;letter-spacing:.5px}
.arrow-tag.is-up{background:#fdf0ee;color:var(--up)}
.arrow-tag.is-down{background:#eef6f1;color:var(--down)}
.origin-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:linear-gradient(135deg,#f5e6c8,#f0d4a8);color:#8a6020;border:1px solid #e8c87a;letter-spacing:.3px;white-space:nowrap;flex-shrink:0;display:inline-block;vertical-align:middle}
.empty{text-align:center;padding:70px 20px;color:var(--text-sub);animation:fadeIn .4s ease}
.empty-icon{font-size:46px;margin-bottom:12px}
.empty-text{font-size:15px;font-weight:500}
.skeleton-list{display:flex;flex-direction:column;gap:9px}
.skeleton-card{background:var(--card);border-radius:16px;padding:15px 16px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:72px}
.sk{background:linear-gradient(90deg,#f5edef 25%,#fdf5f6 50%,#f5edef 75%);background-size:200% 100%;border-radius:8px;animation:shimmer 1.6s infinite}
.sk-t{width:55%;height:14px;margin-bottom:8px}
.sk-s{width:32%;height:11px}
.sk-p{width:68px;height:22px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:11px 24px;border-radius:24px;font-size:13px;font-weight:500;z-index:99998;transition:transform .3s ease;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:768px){:root{--sidebar-w:100px;--header-h:72px}.card-list{display:none}.table-wrap{display:block}.main{padding:22px 28px}.logo-name{font-size:19px}}
@media(min-width:1200px){:root{--sidebar-w:112px}.main{padding:28px 40px}}
@media(max-width:420px){:root{--sidebar-w:72px}.cat-btn{font-size:10px}.logo-name{font-size:14px;letter-spacing:1.5px}.wechat-info{display:none}.wechat-btn{padding:5px 8px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="qr-modal hidden" id="qrModal">
    <div class="qr-modal-inner">
        <img class="qr-modal-img" id="qrBig" alt="微信二维码">
        <div class="qr-modal-id">yueomei</div>
        <div class="qr-modal-tip">长按或截图保存，扫码添加微信</div>
        <button class="qr-modal-close" id="qrModalClose">关 闭</button>
    </div>
</div>
<header class="header">
    <div class="header-logo">
        <div class="logo-emblem">
            <img src="logo" width="42" height="42" fetchpriority="high" alt="悦美" onerror="this.parentElement.style.background='linear-gradient(145deg,#C97A90,#C9A96E)';this.style.display='none';this.parentElement.innerHTML='<span style=\'font-size:20px;display:flex;align-items:center;justify-content:center;height:100%\'>🌸</span>'">
        </div>
        <div class="logo-info">
            <span class="logo-name">悦美价格查询</span>
            <span class="logo-sub">Medical Beauty · Price System</span>
        </div>
    </div>
    <div class="header-right">
        <div class="wechat-btn" id="wechatBtn">
            <img class="wechat-avatar" id="wechatAvatar" src="avatar.jpg" width="26" height="26" decoding="async" alt="微信">
            <div class="wechat-info">
                <span class="wechat-label">微信联系</span>
                <span class="wechat-id">yueomei</span>
            </div>
            <div class="wechat-popup" id="wechatPopup">
                <img class="popup-qr" id="popupQr" width="160" height="160" alt="微信二维码">
                <div class="wechat-popup-text">点击放大 / 搜索微信号</div>
                <div class="wechat-popup-id">yueomei</div>
            </div>
        </div>
        <button class="change-btn" id="changeBtn">今日变动</button>
    </div>
</header>
<div class="layout">
    <nav class="sidebar" id="sidebar"><div class="sidebar-title">分类</div></nav>
    <main class="main" id="main">
        <div class="main-notice">
          <span>最终价格和其他产品以咨询为准。<br>注意批文和国外版本的区别！全国可推大白。</span>
        </div>
        <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" id="searchInput" type="text" placeholder="搜索品牌 / 型号 / 规格…">
        </div>
        <div class="stats-bar">
            <div class="stats-count">共 <strong id="countNum">0</strong> 条结果</div>
            <div class="stats-pills">
                <span class="pill pill-up" id="statUp">↑ 0</span>
                <span class="pill pill-down" id="statDown">↓ 0</span>
            </div>
        </div>
        <div class="card-list" id="cardList">
            <div class="skeleton-list" id="skeleton">
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
            </div>
        </div>
        <div class="table-wrap" id="tableWrap">
            <table class="data-table">
                <thead><tr><th>品牌 / 型号</th><th>规格</th><th>昨日价格</th><th>今日价格</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>
</div>
<script>
(function(){
    var PK=['法国本土版','欧版','韩版','瑞典本土版','台版','法国','日版','西班牙'];
    var CATEGORY_BLOCKLIST=['肉毒','防晒','琼脂糖','司美格鲁肽'];
    var QR_SRC='微信二维码';
    var PAGE=40,ANIM_MAX=12;
    var allRows=[],apiRows=[],xlsxRows=[],curList=[],shown=0;
    var curCategory='all',onlyChanged=false,searchTerm='',searchTimer=null,xlsxPromise=null;

    var mainEl=document.getElementById('main');
    var cardBox=document.getElementById('cardList');
    var tbody=document.getElementById('tableBody');
    var wideMq=window.matchMedia('(min-width:768px)');

    var wechatBtn=document.getElementById('wechatBtn'),wechatPopup=document.getElementById('wechatPopup');
    var popupQr=document.getElementById('popupQr'),qrBig=document.getElementById('qrBig'),qrModal=document.getElementById('qrModal');
    var qrLoaded=false;
    wechatBtn.addEventListener('click',function(e){
        e.stopPropagation();
        if(!qrLoaded){popupQr.src=QR_SRC;qrLoaded=true;}
        wechatPopup.classList.toggle('show');
    });
    popupQr.addEventListener('click',function(e){e.stopPropagation();qrBig.src=QR_SRC;qrModal.classList.remove('hidden');});
    wechatPopup.addEventListener('click',function(e){e.stopPropagation();});
    document.addEventListener('click',function(){wechatPopup.classList.remove('show');});
    document.getElementById('qrModalClose').addEventListener('click',function(){qrModal.classList.add('hidden');});
    qrModal.addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')qrModal.classList.add('hidden');});

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function roundUp5(n){return Math.ceil(n/5)*5;}
    function getRate(n){if(n<100)return 1.32;if(n<500)return 1.30;if(n<1000)return 1.28;if(n<2000)return 1.24;if(n<5000)return 1.20;if(n<8000)return 1.16;return 1.13;}
    function calcPrice(raw){return roundUp5(raw*getRate(raw));}
    function parsePrice(v){if(v==null)return 0;if(typeof v==='number')return v;var m=String(v).replace(/,/g,'').match(/[\d.]+/);return m?parseFloat(m[0]):0;}
    function clean(s){return s?String(s).replace(/\n/g,'').trim():'';}
    function fmt(n){return '¥'+Math.floor(n).toLocaleString('zh-CN');}
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
    function makeRowKey(r){return(r.brand+'|'+r.model+'|'+r.spec).toLowerCase();}

    function decorate(r){
        var full=r.brand+'/'+r.model,kw='批文',pri=0;
        for(var idx=0;idx<PK.length;idx++){
            if(full.indexOf(PK[idx])!==-1){kw=PK[idx];pri=1;break;}
        }
        r.kw=kw;r.pri=pri;
        r.nameHtml=esc(r.model?(r.brand+'/'+r.model):(r.brand||'-'));
        r.specHtml=esc(r.spec||'-');
        r.search=(r.brand+' '+r.model+' '+r.spec).toLowerCase();
        r.diff=r.tp-r.yp;
        return r;
    }

    function sortWithPriority(arr){
        var groups={},order=[];
        arr.forEach(function(r){
            var k=r.brand.toLowerCase();
            if(!groups[k]){groups[k]={rows:[],hasPri:false};order.push(k);}
            groups[k].rows.push(r);
            if(r.pri===1)groups[k].hasPri=true;
        });
        var pk=[],nk=[];
        order.forEach(function(k){if(groups[k].hasPri)pk.push(k);else nk.push(k);});
        var sorted=[];
        pk.concat(nk).forEach(function(k){groups[k].rows.forEach(function(r){sorted.push(r);});});
        return sorted;
    }

    function mergeRows(blacklist){
        var seen=new Set(),merged=[];
        xlsxRows.concat(apiRows).forEach(function(r){
            var bm=r.model?(r.brand+'/'+r.model):r.brand;
            if(blacklist&&blacklist.has(bm))return;
            if(r.category&&CATEGORY_BLOCKLIST.indexOf(r.category)!==-1)return;
            var key=makeRowKey(r);
            if(!seen.has(key)){seen.add(key);merged.push(decorate(r));}
        });
        return sortWithPriority(merged);
    }

    function loadXlsx(){
        if(xlsxPromise)return xlsxPromise;
        xlsxPromise=new Promise(function(ok,fail){
            var s=document.createElement('script');
            s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
            s.async=true;
            s.onload=ok;s.onerror=fail;
            document.head.appendChild(s);
        });
        return xlsxPromise;
    }

    async function fetchXlsx(){
        var empty={rows:[],blacklist:new Set()};
        try{
            var res=await fetch('data.xlsx',{cache:'no-cache'});
            if(!res.ok)return empty;
            var buf=await res.arrayBuffer();
            await loadXlsx();
            var wb=XLSX.read(buf,{type:'array'});
            var rows=[],blacklist=new Set();
            wb.SheetNames.forEach(function(sheetName){
                if(sheetName==='全部')return;
                var ws=wb.Sheets[sheetName];
                if(sheetName==='删除'){
                    XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(function(row){
                        var bm=clean(row['品牌/型号']||'');
                        if(bm)blacklist.add(bm);
                    });
                    return;
                }
                var cat=clean(sheetName);
                XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(function(row){
                    var bm=clean(row['品牌/型号']||''),parts=bm.split('/');
                    var brand=parts[0]||'',model=parts.slice(1).join('/')||'';
                    if(!brand&&!model)return;
                    rows.push({brand:clean(brand),model:clean(model),spec:clean(row['规格']||''),category:cat,yp:calcPrice(parsePrice(row['昨日价格'])),tp:calcPrice(parsePrice(row['今日价格']))});
                });
            });
            return{rows:rows,blacklist:blacklist};
        }catch(e){return empty;}
    }

    async function fetchJson(){
        try{
            var res=await fetch('data.json',{cache:'no-cache'});
            if(!res.ok)throw new Error('HTTP '+res.status);
            var body=await res.json();
            var prods=Array.isArray(body)?body:(body.all_products_dedup||body.products||[]);
            return Array.isArray(prods)?prods:[];
        }catch(e){showToast('数据加载失败，请刷新重试');return[];}
    }

    async function init(){
        var raw=await fetchJson();
        apiRows=raw.map(function(item){
            return{brand:clean(item.brand||''),model:clean(item.model||''),spec:clean(item.specification||''),category:clean(item.category||''),yp:calcPrice(parsePrice(item.yesterday_price)),tp:calcPrice(parsePrice(item.today_price))};
        });
        allRows=mergeRows(null);
        buildSidebar();
        render();

        var loadMore=function(){
            fetchXlsx().then(function(xr){
                if(xr.rows.length===0&&xr.blacklist.size===0)return;
                xlsxRows=xr.rows;
                allRows=mergeRows(xr.blacklist);
                buildSidebar();
                render();
            });
        };
        if(window.requestIdleCallback)requestIdleCallback(loadMore,{timeout:2500});
        else setTimeout(loadMore,400);
    }

    function buildSidebar(){
        var counts={},cats=[];
        allRows.forEach(function(r){
            if(!r.category)return;
            if(!counts[r.category]){counts[r.category]=0;cats.push(r.category);}
            counts[r.category]++;
        });
        var sidebar=document.getElementById('sidebar'),title=sidebar.querySelector('.sidebar-title');
        var frag=document.createDocumentFragment();
        var tabs=[{id:'all',name:'全部',count:allRows.length}];
        cats.forEach(function(c){tabs.push({id:c,name:c,count:counts[c]});});
        tabs.forEach(function(c){
            var btn=document.createElement('button');
            btn.className='cat-btn'+(c.id===curCategory?' active':'');
            btn.dataset.id=c.id;
            btn.innerHTML=esc(c.name)+'<span class="cat-count">'+c.count+'</span>';
            frag.appendChild(btn);
        });
        sidebar.innerHTML='';
        sidebar.appendChild(title);
        sidebar.appendChild(frag);
    }

    document.getElementById('sidebar').addEventListener('click',function(e){
        var btn=e.target.closest('.cat-btn');
        if(!btn)return;
        this.querySelectorAll('.cat-btn.active').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        curCategory=btn.dataset.id;
        render();
        mainEl.scrollTo({top:0});
    });

    function getFiltered(){
        var q=searchTerm.toLowerCase();
        return allRows.filter(function(r){
            if(curCategory!=='all'&&r.category!==curCategory)return false;
            if(onlyChanged&&r.diff===0)return false;
            if(q&&r.search.indexOf(q)===-1)return false;
            return true;
        });
    }

    function render(){
        curList=getFiltered();
        var upCnt=0,downCnt=0;
        curList.forEach(function(r){if(r.diff>0)upCnt++;else if(r.diff<0)downCnt++;});
        document.getElementById('countNum').textContent=curList.length;
        document.getElementById('statUp').textContent='↑ '+upCnt;
        document.getElementById('statDown').textContent='↓ '+downCnt;

        var sk=document.getElementById('skeleton');
        if(sk)sk.remove();
        shown=0;
        cardBox.innerHTML='';
        tbody.innerHTML='';

        if(curList.length===0){
            var tip='<div class="empty"><div class="empty-icon">🌿</div><div class="empty-text">暂无相关数据</div></div>';
            if(wideMq.matches)tbody.innerHTML='<tr><td colspan="4">'+tip+'</td></tr>';
            else cardBox.innerHTML=tip;
            return;
        }
        appendMore();
    }

    function appendMore(){
        var part=curList.slice(shown,shown+PAGE);
        if(part.length===0)return;
        var start=shown;
        shown+=part.length;
        if(wideMq.matches)tbody.insertAdjacentHTML('beforeend',buildRows(part,start));
        else cardBox.insertAdjacentHTML('beforeend',buildCards(part,start));
    }

    function buildCards(rows,start){
        var out=[];
        rows.forEach(function(r,idx){
            var pos=start+idx;
            var cls=r.diff>0?'is-up':r.diff<0?'is-down':'';
            var tag=r.diff>0?'<span class="price-tag is-up">涨</span>':r.diff<0?'<span class="price-tag is-down">降</span>':'';
            var old=r.diff!==0?'<div class="price-old">'+fmt(r.yp)+'</div>':'';
            var anim=pos<ANIM_MAX?' style="animation-delay:'+(pos*0.03)+'s"':'';
            var na=pos<ANIM_MAX?'':' na';
            out.push('<div class="price-card '+cls+na+'"'+anim+'><div class="card-left"><div class="card-name">'+r.nameHtml+'</div><div class="card-bottom-row"><span class="card-spec">'+r.specHtml+'</span><span class="origin-badge">'+r.kw+'</span></div></div><div class="card-right"><div class="price-today '+cls+'">'+fmt(r.tp)+'</div>'+old+tag+'</div></div>');
        });
        return out.join('');
    }

    function buildRows(rows,start){
        var out=[];
        rows.forEach(function(r,idx){
            var pos=start+idx;
            var cls=r.diff>0?'is-up':r.diff<0?'is-down':'';
            var tag=r.diff>0?'<span class="arrow-tag is-up">↑ 涨</span>':r.diff<0?'<span class="arrow-tag is-down">↓ 降</span>':'';
            var anim=pos<ANIM_MAX?' style="animation-delay:'+(pos*0.025)+'s"':'';
            var na=pos<ANIM_MAX?'':' class="na"';
            out.push('<tr'+na+anim+'><td><span class="td-name">'+r.nameHtml+'</span><span class="origin-badge">'+r.kw+'</span></td><td><span class="td-spec">'+r.specHtml+'</span></td><td class="td-yp">'+fmt(r.yp)+'</td><td class="td-tp '+cls+'">'+fmt(r.tp)+tag+'</td></tr>');
        });
        return out.join('');
    }

    var scrollBusy=false;
    mainEl.addEventListener('scroll',function(){
        if(scrollBusy||shown>=curList.length)return;
        scrollBusy=true;
        requestAnimationFrame(function(){
            if(mainEl.scrollTop+mainEl.clientHeight>mainEl.scrollHeight-500)appendMore();
            scrollBusy=false;
        });
    },{passive:true});

    if(wideMq.addEventListener)wideMq.addEventListener('change',function(){if(allRows.length>0)render();});

    document.getElementById('searchInput').addEventListener('input',function(e){
        var v=e.target.value.trim();
        clearTimeout(searchTimer);
        searchTimer=setTimeout(function(){searchTerm=v;render();},200);
    });
    document.getElementById('changeBtn').addEventListener('click',function(){
        onlyChanged=!onlyChanged;
        this.classList.toggle('active');
        render();
    });

    init();
})();
</script>
</body>
</html>
