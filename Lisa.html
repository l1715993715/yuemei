<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>恩美Lisa · 价格查询系统</title>
<link rel="icon" href="images/Lisa头像.png" type="image/png">
<meta property="og:title" content="恩美Lisa · 价格查询系统">
<meta property="og:description" content="产品价格查询">
<meta property="og:image" content="images/Lisa头像.png">
<meta property="og:url" content="https://yuemei.store/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
<link rel="preload" href="images/Lisa头像.png" as="image">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --gold:#A8874E;
    --gold-deep:#80633A;
    --gold-light:#D9C49A;
    --gold-pale:#F8F4EB;
    --gold-mid:#E7D9BE;
    --gold-soft:#F1E8D8;

    --white:#FFFFFF;
    --off-white:#FCFBF8;
    --cream:#F6F2EA;
    --bg:#F7F6F2;
    --card:#FFFFFF;

    --text:#000000;
    --text-sub:#222222;
    --text-light:#444444;

    --border:#E6DECF;
    --border-light:#F1ECE3;

    --up:#C0392B;
    --up-bg:#F9EFEC;
    --down:#2E8B57;
    --down-bg:#EEF4F0;

    --skeleton-base:#F0ECE4;
    --skeleton-highlight:#FAF7F1;

    --gold-rgb:168,135,78;
    --ink-rgb:47,42,35;
    --white-rgb:255,255,255;

    --sidebar-w:88px;
    --header-h:68px;

    --shadow-sm:0 2px 14px rgba(var(--ink-rgb),.045);
    --shadow-md:0 8px 28px rgba(var(--ink-rgb),.075);
    --shadow-lg:0 18px 56px rgba(var(--ink-rgb),.14);
    --shadow-gold:0 6px 20px rgba(var(--gold-rgb),.18);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:linear-gradient(145deg,var(--off-white) 0%,var(--bg) 52%,var(--cream) 100%);color:var(--text);overflow-x:hidden}

@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.35)}50%{box-shadow:0 0 0 8px rgba(var(--gold-rgb),0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes floatBadge{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes qrZoomIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes logoPop{0%{opacity:0;transform:scale(.6) translateY(10px)}60%{transform:scale(1.08) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes titleSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes wechatFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes lineSweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.overlay{position:fixed;inset:0;background:linear-gradient(155deg,var(--off-white) 0%,var(--gold-pale) 52%,var(--off-white) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease}
.overlay.hide{opacity:0;pointer-events:none}
.overlay-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.overlay-deco::before{content:'';position:absolute;top:-120px;right:-120px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.08) 0%,transparent 70%)}
.overlay-deco::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.06) 0%,transparent 70%)}
.overlay-logo-wrap{width:84px;height:84px;border-radius:50%;overflow:hidden;margin-bottom:20px;animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) both;border:2px solid var(--gold-mid);box-shadow:0 0 0 6px rgba(var(--gold-rgb),.08),var(--shadow-md)}
.overlay-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.overlay-logo-emoji{font-size:60px;margin-bottom:20px;animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) both;display:none}
.overlay-ornament{display:flex;align-items:center;gap:10px;margin-bottom:14px;animation:titleSlide .6s ease .2s both}
.overlay-ornament span{display:block;width:32px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light))}
.overlay-ornament span:last-child{background:linear-gradient(90deg,var(--gold-light),transparent)}
.overlay-ornament i{font-style:normal;font-size:10px;color:var(--text);letter-spacing:3px}
.overlay-title{font-size:21px;font-weight:900;letter-spacing:5px;color:var(--text);margin-bottom:4px;animation:titleSlide .6s ease .3s both}
.overlay-title em{font-style:normal;color:var(--text);-webkit-text-fill-color:var(--text);background:none}
.overlay-sub{font-size:10px;color:var(--text-light);letter-spacing:3px;margin-bottom:32px;animation:titleSlide .6s ease .4s both;text-transform:uppercase}
.overlay-spinner-wrap{width:44px;height:44px;margin-bottom:24px;animation:fadeIn .4s ease .5s both}
.spinner-ring{width:44px;height:44px;border:2px solid var(--gold-pale);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
.overlay-text{font-size:13px;color:var(--text);font-weight:600;letter-spacing:2px;margin-bottom:24px;animation:titleSlide .6s ease .55s both}
.overlay-wechat{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--gold-mid);border-radius:28px;padding:8px 18px 8px 8px;animation:wechatFade .6s ease .7s both;box-shadow:var(--shadow-sm)}
.overlay-wechat img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-mid)}
.overlay-wechat-info{display:flex;flex-direction:column;line-height:1.3}
.overlay-wechat-label{font-size:9px;color:var(--text-light);letter-spacing:.5px}
.overlay-wechat-id{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px}

.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:rgba(var(--white-rgb),.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:200;box-shadow:0 1px 22px rgba(var(--ink-rgb),.045);animation:fadeIn .5s ease}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold-light) 30%,var(--gold) 50%,var(--gold-light) 70%,transparent 100%);opacity:.6}
.header-logo{display:flex;align-items:center;gap:14px}
.logo-emblem{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1.5px solid var(--gold-mid);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.08);animation:pulseGold 3s infinite}
.logo-emblem img{width:100%;height:100%;object-fit:cover;display:block}
.logo-divider{width:1px;height:28px;background:linear-gradient(to bottom,transparent,var(--gold-mid),transparent)}
.logo-info{display:flex;flex-direction:column}
.logo-name{font-size:16px;font-weight:800;letter-spacing:3px;color:var(--text);line-height:1.2}
.logo-name em{font-style:normal;color:var(--text)}
.logo-sub{font-size:9px;color:var(--text-light);letter-spacing:2px;margin-top:2px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:10px}

.wechat-btn{position:relative;display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--gold-mid);border-radius:28px;padding:6px 14px 6px 7px;cursor:pointer;transition:all .25s;text-decoration:none;box-shadow:var(--shadow-sm)}
.wechat-btn:hover{border-color:var(--gold);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.wechat-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--gold-mid)}
.wechat-info{display:flex;flex-direction:column;line-height:1.2}
.wechat-label{font-size:9px;color:var(--text-light);letter-spacing:.5px}
.wechat-id{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.5px}
.wechat-popup{position:absolute;top:calc(100% + 12px);right:0;background:var(--white);border:1px solid var(--gold-mid);border-radius:18px;padding:18px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;align-items:center;gap:10px;z-index:9000;white-space:nowrap;animation:fadeInUp .2s ease;min-width:196px}
.wechat-popup::before{content:'';position:absolute;top:-6px;right:22px;width:10px;height:10px;background:var(--white);border-top:1px solid var(--gold-mid);border-left:1px solid var(--gold-mid);transform:rotate(45deg)}
.wechat-popup.show{display:flex}
.wechat-popup .popup-qr{width:156px;height:156px;border-radius:12px;object-fit:cover;border:1px solid var(--gold-mid);cursor:zoom-in;transition:transform .2s;display:block}
.wechat-popup .popup-qr:hover{transform:scale(1.03)}
.wechat-popup-text{font-size:11px;color:var(--text-light);text-align:center;letter-spacing:.5px}
.wechat-popup-id{font-size:14px;font-weight:700;color:var(--text)}

.qr-modal{position:fixed;inset:0;background:rgba(var(--ink-rgb),.74);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99999;animation:fadeIn .2s ease}
.qr-modal.hidden{display:none}
.qr-modal-inner{background:var(--white);border-radius:24px;padding:30px 30px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow-lg);animation:qrZoomIn .25s ease;max-width:90vw;border:1px solid var(--gold-mid)}
.qr-modal-img{width:min(300px,78vw);height:min(300px,78vw);border-radius:14px;object-fit:cover;border:1px solid var(--gold-mid)}
.qr-modal-id{font-size:17px;font-weight:800;color:var(--text);letter-spacing:1.5px}
.qr-modal-tip{font-size:11px;color:var(--text-light);letter-spacing:.5px}
.qr-modal-close{margin-top:4px;font-size:12px;font-weight:700;color:var(--text);background:var(--gold-pale);border:1px solid var(--gold-mid);padding:9px 32px;border-radius:28px;cursor:pointer;transition:all .2s;letter-spacing:1px}
.qr-modal-close:hover{background:var(--gold-mid)}

.change-btn{font-size:12px;font-weight:700;color:var(--text);background:var(--white);border:1px solid var(--gold-mid);padding:8px 16px;border-radius:28px;cursor:pointer;transition:all .25s;white-space:nowrap;letter-spacing:.5px;box-shadow:var(--shadow-sm)}
.change-btn:hover{background:var(--gold-pale);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.change-btn.active{background:linear-gradient(135deg,var(--gold-light),var(--gold-mid));color:var(--text);border-color:transparent;box-shadow:0 4px 18px rgba(var(--gold-rgb),.38)}

.layout{display:flex;padding-top:var(--header-h);height:100vh;overflow:hidden}

.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--border-light);overflow-y:auto;overflow-x:hidden;padding:14px 6px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none;animation:fadeIn .6s ease}
.sidebar::-webkit-scrollbar{display:none}
.sidebar-title{font-size:9px;letter-spacing:2.5px;color:var(--text);font-weight:800;text-align:center;padding:6px 0 14px;text-transform:uppercase}
.cat-btn{width:100%;padding:10px 5px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text-sub);font-size:11px;font-weight:600;cursor:pointer;transition:all .22s;text-align:center;line-height:1.4;word-break:break-all;animation:slideInLeft .4s ease both}
.cat-btn:hover{background:var(--gold-pale);color:var(--text);border-color:var(--gold-mid)}
.cat-btn.active{background:linear-gradient(135deg,var(--gold-light),var(--gold-mid));color:var(--text);font-weight:800;border-color:transparent;box-shadow:var(--shadow-gold);animation:floatBadge 2.5s infinite}
.cat-count{display:block;font-size:10px;margin-top:3px;opacity:.9;font-weight:700}
.cat-btn:not(.active) .cat-count{color:var(--text)}

.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px;scrollbar-width:thin;scrollbar-color:var(--gold-mid) transparent}

.main-notice{text-align:center;font-size:11px;color:var(--text-sub);letter-spacing:.8px;margin-bottom:14px;animation:fadeInUp .5s ease both}
.main-notice span{background:var(--white);border:1px solid var(--border-light);border-radius:24px;padding:6px 18px;display:inline-block;box-shadow:var(--shadow-sm);line-height:1.8}

.search-wrap{position:relative;margin-bottom:14px;animation:fadeInUp .5s ease .1s both}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gold-light);pointer-events:none}
.search-input{width:100%;padding:13px 18px 13px 46px;border:1px solid var(--border);border-radius:16px;font-size:14px;font-weight:500;background:var(--white);color:var(--text);transition:all .25s;outline:none;box-shadow:0 4px 20px rgba(var(--ink-rgb),.035);letter-spacing:.3px}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.10)}
.search-input::placeholder{color:var(--text-light);font-weight:400}

.stats-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px;animation:fadeInUp .5s ease .2s both}
.stats-count{font-size:13px;font-weight:500;color:var(--text-sub)}
.stats-count strong{color:var(--text);font-weight:800;font-size:15px}
.stats-pills{display:flex;gap:8px}
.pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px}
.pill-up{background:var(--up-bg);color:var(--up)}
.pill-down{background:var(--down-bg);color:var(--down)}

.card-list{display:flex;flex-direction:column;gap:8px}
.price-card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;transition:all .22s;box-shadow:var(--shadow-sm);animation:fadeInUp .4s ease both}
.price-card:hover{border-color:var(--gold-mid);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.price-card:active{transform:scale(.982)}
.price-card.is-up{border-left:2px solid var(--up)}
.price-card.is-down{border-left:2px solid var(--down)}
.card-left{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;letter-spacing:.3px}
.card-bottom-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.card-spec{font-size:11px;color:var(--text-sub);background:var(--cream);display:inline-block;padding:3px 10px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;border:1px solid var(--border-light)}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:12px;flex-shrink:0}
.price-today{font-size:18px;font-weight:800;color:var(--text);letter-spacing:.5px}
.price-today.is-up{color:var(--up)}
.price-today.is-down{color:var(--down)}
.price-old{font-size:11px;color:var(--text-light);text-decoration:line-through}
.price-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.5px}
.price-tag.is-up{background:var(--up-bg);color:var(--up)}
.price-tag.is-down{background:var(--down-bg);color:var(--down)}

.table-wrap{display:none;background:var(--card);border-radius:20px;border:1px solid var(--border-light);overflow:hidden;box-shadow:var(--shadow-md);animation:fadeInUp .5s ease .15s both}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed}
.data-table thead tr{background:linear-gradient(180deg,var(--white),var(--gold-pale));border-bottom:1px solid var(--gold-mid)}
.data-table th{padding:16px 22px;text-align:left;font-size:12px;font-weight:700;color:var(--text);letter-spacing:2.5px}
.data-table th:nth-child(1){width:36%}
.data-table th:nth-child(2){width:24%}
.data-table th:nth-child(3){width:20%;text-align:right}
.data-table th:nth-child(4){width:20%;text-align:right}
.data-table tbody tr{border-bottom:1px solid var(--border-light);transition:all .18s;animation:rowIn .35s ease both}
.data-table tbody tr:last-child{border-bottom:none}
.data-table tbody tr:hover{background:var(--gold-pale);transform:translateX(2px)}
.data-table td{padding:14px 22px;font-size:14px;vertical-align:middle}
.data-table td:nth-child(3),.data-table td:nth-child(4){text-align:right}
.td-name{font-weight:700;color:var(--text);font-size:14px;letter-spacing:.3px}
.td-spec{font-size:11px;color:var(--text-sub);background:var(--cream);padding:3px 10px;border-radius:20px;display:inline-block;border:1px solid var(--border-light)}
.td-yp{color:var(--text-light);font-size:13px;font-weight:400;text-decoration:line-through}
.td-tp{font-weight:800;font-size:15px;color:var(--text)}
.td-tp.is-up{color:var(--up)}
.td-tp.is-down{color:var(--down)}
.arrow-tag{font-size:10px;padding:2px 7px;border-radius:4px;margin-left:5px;font-weight:800;letter-spacing:.5px}
.arrow-tag.is-up{background:var(--up-bg);color:var(--up)}
.arrow-tag.is-down{background:var(--down-bg);color:var(--down)}

.origin-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:linear-gradient(135deg,var(--gold-pale),var(--gold-mid));color:var(--text);border:1px solid rgba(var(--gold-rgb),.3);letter-spacing:.3px;white-space:nowrap;flex-shrink:0;display:inline-block;vertical-align:middle}

.empty{text-align:center;padding:70px 20px;color:var(--text-light);animation:fadeIn .4s ease}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px;font-weight:500;letter-spacing:1px}

.skeleton-list{display:flex;flex-direction:column;gap:8px}
.skeleton-card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}
.sk{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-highlight) 50%,var(--skeleton-base) 75%);background-size:200% 100%;border-radius:6px;animation:shimmer 1.6s infinite}
.sk-t{width:55%;height:14px;margin-bottom:8px}
.sk-s{width:32%;height:11px}
.sk-p{width:68px;height:22px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--white);padding:11px 26px;border-radius:28px;font-size:13px;font-weight:500;z-index:99998;transition:transform .3s ease;white-space:nowrap;pointer-events:none;letter-spacing:.5px}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(min-width:768px){:root{--sidebar-w:100px;--header-h:72px}.card-list{display:none}.table-wrap{display:block}.main{padding:24px 32px}.logo-name{font-size:18px}}
@media(min-width:1200px){:root{--sidebar-w:112px}.main{padding:28px 44px}}
@media(max-width:420px){:root{--sidebar-w:72px}.cat-btn{font-size:10px}.logo-name{font-size:14px;letter-spacing:1.5px}.wechat-info{display:none}.wechat-btn{padding:6px 9px}.overlay-title{font-size:17px;letter-spacing:2.5px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

    
</head>
<body>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
    <div class="overlay-deco"></div>
    <div class="overlay-logo-wrap">
        <img src="images/Lisa头像.png" alt="恩美Lisa" onerror="this.parentElement.style.display='none';document.getElementById('overlayEmoji').style.display='block'">
    </div>
    <div class="overlay-logo-emoji" id="overlayEmoji">✦</div>
    <div class="overlay-ornament">
        <span></span><i>ENMEI · LISA</i><span></span>
    </div>
    <div class="overlay-title">恩美<em>Lisa</em>价格查询</div>
    <div class="overlay-sub">Medical Beauty · Price System</div>
    <div class="overlay-spinner-wrap"><div class="spinner-ring"></div></div>
    <div class="overlay-text">正在加载价格数据…</div>
    <div class="overlay-wechat">
        <img src="avatar.jpg" alt="微信">
        <div class="overlay-wechat-info">
            <span class="overlay-wechat-label">微信联系</span>
            <span class="overlay-wechat-id">enmine999</span>
        </div>
    </div>
</div>

<div class="qr-modal hidden" id="qrModal">
    <div class="qr-modal-inner">
        <img class="qr-modal-img" src="images/恩美Lisa二维码.png" alt="微信二维码" loading="lazy" decoding="async">
        <div class="qr-modal-id">enmine999</div>
        <div class="qr-modal-tip">长按或截图保存，扫码添加微信</div>
        <button class="qr-modal-close" id="qrModalClose">关 闭</button>
    </div>
</div>

<header class="header">
    <div class="header-logo">
        <div class="logo-emblem">
            <img src="images/Lisa头像.png" alt="恩美Lisa" onerror="this.parentElement.style.background='linear-gradient(145deg,#B8963E,#D4AF6A)';this.style.display='none';this.parentElement.innerHTML='<span style=\'font-size:18px;display:flex;align-items:center;justify-content:center;height:100%;color:#fff\'>✦</span>'">
        </div>
        <div class="logo-divider"></div>
        <div class="logo-info">
            <span class="logo-name">恩美<em>Lisa</em>价格查询</span>
            <span class="logo-sub">Medical Beauty · Price System</span>
        </div>
    </div>
    <div class="header-right">
        <div class="wechat-btn" id="wechatBtn">
            <img class="wechat-avatar" src="avatar.jpg" alt="微信">
            <div class="wechat-info">
                <span class="wechat-label">微信联系</span>
                <span class="wechat-id">enmine999</span>
            </div>
            <div class="wechat-popup" id="wechatPopup">
                <img class="popup-qr" id="popupQr" src="images/恩美Lisa二维码.png" alt="微信二维码" loading="lazy" decoding="async">
                <div class="wechat-popup-text">点击放大 / 搜索微信号</div>
                <div class="wechat-popup-id">enmine999</div>
            </div>
        </div>
        <button class="change-btn" id="changeBtn">今日变动</button>
    </div>
</header>

<div class="layout">
    <nav class="sidebar" id="sidebar"><div class="sidebar-title">分类</div></nav>
    <main class="main" id="main">
        <div class="main-notice">
            <span>最终价格和其他产品以咨询为准。<br>注意批文和国外版本的区别！全国可推大白。</span>
        </div>
        <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" id="searchInput" type="text" placeholder="搜索品牌 / 型号 / 规格…">
        </div>
        <div class="stats-bar">
            <div class="stats-count">共 <strong id="countNum">0</strong> 条结果</div>
            <div class="stats-pills">
                <span class="pill pill-up" id="statUp">↑ 0</span>
                <span class="pill pill-down" id="statDown">↓ 0</span>
            </div>
        </div>
        <div class="card-list" id="cardList">
            <div class="skeleton-list" id="skeleton">
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
                <div class="skeleton-card"><div><div class="sk sk-t"></div><div class="sk sk-s"></div></div><div class="sk sk-p"></div></div>
            </div>
        </div>
        <div class="table-wrap" id="tableWrap">
            <table class="data-table">
                <thead><tr><th>品牌 / 型号</th><th>规格</th><th>昨日价格</th><th>今日价格</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>
</div>

<script>
(function(){
    var PK=['法国本土版','欧版','韩版','瑞典本土版','台版','法国','日版','西班牙'];
    var CATEGORY_BLOCKLIST=['肉毒','防晒','琼脂糖','司美格鲁肽'];
    var allRows=[],apiRows=[],xlsxRows=[],curCategory='all',onlyChanged=false,searchTerm='';
    var lastData=null;
    var mq=window.matchMedia('(min-width:768px)');

    var wechatBtn=document.getElementById('wechatBtn'),wechatPopup=document.getElementById('wechatPopup');
    wechatBtn.addEventListener('click',function(e){e.stopPropagation();wechatPopup.classList.toggle('show');});
    document.getElementById('popupQr').addEventListener('click',function(e){e.stopPropagation();document.getElementById('qrModal').classList.remove('hidden');});
    wechatPopup.addEventListener('click',function(e){e.stopPropagation();});
    document.addEventListener('click',function(){wechatPopup.classList.remove('show');});
    document.getElementById('qrModalClose').addEventListener('click',function(){document.getElementById('qrModal').classList.add('hidden');});
    document.getElementById('qrModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('qrModal').classList.add('hidden');});

    function getPriority(r){var n=r.brand+'/'+r.model;for(var i=0;i<PK.length;i++)if(n.indexOf(PK[i])!==-1)return 1;return 0;}
    function getKw(r){var n=r.brand+'/'+r.model;for(var i=0;i<PK.length;i++)if(n.indexOf(PK[i])!==-1)return PK[i];return '批文';}
    function sortWithPriority(arr){
        var groups={},order=[];
        arr.forEach(function(r){var k=r.brand.toLowerCase();if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(r);});
        var pk=[],nk=[];
        order.forEach(function(k){if(groups[k].some(function(r){return getPriority(r)===1;}))pk.push(k);else nk.push(k);});
        var res=[];pk.concat(nk).forEach(function(k){groups[k].forEach(function(r){res.push(r);});});
        return res;
    }
    function roundUp5(n){return Math.ceil(n/5)*5;}
    function getRate(n){if(n<100)return 1.27;if(n<500)return 1.25;if(n<1000)return 1.23;if(n<2000)return 1.19;if(n<5000)return 1.15;if(n<8000)return 1.11;return 1.08;}
    function calcPrice(raw,cat){return roundUp5(raw*getRate(raw));}
    function parsePrice(v){if(v==null)return 0;if(typeof v==='number')return v;var m=String(v).replace(/,/g,'').match(/[\d.]+/);return m?parseFloat(m[0]):0;}
    function clean(s){return s?String(s).replace(/\n/g,'').trim():'';}
    function fmt(n){return '¥'+Math.floor(n).toLocaleString('zh-CN');}
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
    function hideOverlay(){var ov=document.getElementById('overlay');ov.classList.add('hide');setTimeout(function(){ov.style.display='none';},600);}
    function makeRowKey(r){return(r.brand+'|'+r.model+'|'+r.spec).toLowerCase();}
    function delay(i,step){return(Math.min(i,20)*step).toFixed(3)+'s';}

    function mergeRows(blacklist){
        var seen=new Set(),result=[];
        xlsxRows.concat(apiRows).forEach(function(r){
            var bm=r.model?(r.brand+'/'+r.model):r.brand;
            if(blacklist&&blacklist.has(bm))return;
            if(r.category&&CATEGORY_BLOCKLIST.indexOf(r.category)!==-1)return;
            var key=makeRowKey(r);
            if(!seen.has(key)){seen.add(key);result.push(r);}
        });
        return result;
    }

    var xlsxLoader=null;
    function loadSheetJS(){
        if(window.XLSX)return Promise.resolve();
        if(xlsxLoader)return xlsxLoader;
        xlsxLoader=new Promise(function(resolve,reject){
            var s=document.createElement('script');
            s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
            s.async=true;
            s.onload=resolve;
            s.onerror=function(){xlsxLoader=null;s.remove();reject(new Error('SheetJS load failed'));};
            document.head.appendChild(s);
        });
        return xlsxLoader;
    }

    async function fetchXlsx(){
        var results=await Promise.all([fetch('data.xlsx'),loadSheetJS()]);
        var res=results[0];
        if(!res.ok)throw new Error('xlsx HTTP '+res.status);
        var buf=await res.arrayBuffer();
        var wb=XLSX.read(buf,{type:'array'});
        var rows=[],blacklist=new Set();
        wb.SheetNames.forEach(function(sheetName){
            if(sheetName==='全部')return;
            var ws=wb.Sheets[sheetName];
            if(sheetName==='删除'){
                XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(function(row){
                    var bm=clean(row['品牌/型号']||'');
                    if(bm)blacklist.add(bm);
                });
                return;
            }
            var cat=clean(sheetName);
            XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(function(row){
                var bm=clean(row['品牌/型号']||''),parts=bm.split('/');
                var brand=parts[0]||'',model=parts.slice(1).join('/')||'';
                if(!brand&&!model)return;
                rows.push({brand:clean(brand),model:clean(model),spec:clean(row['规格']||''),category:cat,yp:calcPrice(parsePrice(row['昨日价格']),cat),tp:calcPrice(parsePrice(row['今日价格']),cat)});
            });
        });
        return{rows:rows,blacklist:blacklist};
    }

    async function fetchData(){
        var v=Math.floor(Date.now()/600000);
        var res=await fetch('data.json?v='+v);
        if(!res.ok)throw new Error('json HTTP '+res.status);
        var data=await res.json();
        var list=Array.isArray(data)?data:(data.all_products_dedup||data.products||[]);
        if(!Array.isArray(list))throw new Error('json format error');
        return list;
    }

    function mapApi(raw){
        return raw.map(function(item){
            var cat=clean(item.category||'');
            return{brand:clean(item.brand||''),model:clean(item.model||''),spec:clean(item.specification||''),category:cat,yp:calcPrice(parsePrice(item.yesterday_price),cat),tp:calcPrice(parsePrice(item.today_price),cat)};
        });
    }

    function applyAll(raw,xlsxResult){
        apiRows=mapApi(raw);
        xlsxRows=xlsxResult.rows;
        allRows=mergeRows(xlsxResult.blacklist);
        buildSidebar();render();
    }

    async function init(){
        for(var i=0;i<3;i++){
            try{
                var r=await Promise.all([fetchData(),fetchXlsx()]);
                applyAll(r[0],r[1]);
                hideOverlay();
                return;
            }catch(e){
                if(i<2)await new Promise(function(res){setTimeout(res,1000*(i+1));});
            }
        }
        var t=document.querySelector('.overlay-text');
        t.textContent='加载失败，点击此处重试';
        t.style.cursor='pointer';
        t.onclick=function(){location.reload();};
        document.querySelector('.overlay-spinner-wrap').style.display='none';
    }

    function buildSidebar(){
        var seen=new Set(),cats=[];
        allRows.forEach(function(r){if(r.category&&!seen.has(r.category)){seen.add(r.category);cats.push(r.category);}});
        var all=[{id:'all',name:'全部',count:allRows.length}].concat(cats.map(function(c){return{id:c,name:c,count:allRows.filter(function(r){return r.category===c;}).length};}));
        var sidebar=document.getElementById('sidebar'),title=sidebar.querySelector('.sidebar-title');
        sidebar.innerHTML='';sidebar.appendChild(title);
        all.forEach(function(c,i){
            var btn=document.createElement('button');
            btn.className='cat-btn'+(c.id===curCategory?' active':'');
            btn.dataset.id=c.id;btn.style.animationDelay=(i*0.04)+'s';
            btn.innerHTML=c.name+'<span class="cat-count">'+c.count+'</span>';
            btn.addEventListener('click',function(){
                sidebar.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});
                btn.classList.add('active');curCategory=c.id;render();
                document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
            });
            sidebar.appendChild(btn);
        });
    }

    function getFiltered(){
        var filtered=allRows.filter(function(r){
            if(curCategory!=='all'&&r.category!==curCategory)return false;
            if(onlyChanged&&r.yp===r.tp)return false;
            if(searchTerm){var q=searchTerm.toLowerCase();if(![r.brand,r.model,r.spec].some(function(s){return s.toLowerCase().includes(q);}))return false;}
            return true;
        });
        return sortWithPriority(filtered);
    }

    function draw(data){
        if(mq.matches){
            document.getElementById('cardList').innerHTML='';
            renderTable(data);
        }else{
            document.getElementById('tableBody').innerHTML='';
            renderCards(data);
        }
    }

    function render(){
        var data=getFiltered();
        lastData=data;
        var upCnt=data.filter(function(r){return r.tp>r.yp;}).length;
        var downCnt=data.filter(function(r){return r.tp<r.yp;}).length;
        document.getElementById('countNum').textContent=data.length;
        document.getElementById('statUp').textContent='↑ '+upCnt;
        document.getElementById('statDown').textContent='↓ '+downCnt;
        draw(data);
    }

    function onBreakpointChange(){if(lastData)draw(lastData);}
    if(mq.addEventListener)mq.addEventListener('change',onBreakpointChange);
    else if(mq.addListener)mq.addListener(onBreakpointChange);

    function renderCards(data){
        var el=document.getElementById('cardList'),sk=document.getElementById('skeleton');
        if(sk)sk.remove();
        if(!data.length){el.innerHTML='<div class="empty"><div class="empty-icon">◇</div><div class="empty-text">暂无相关数据</div></div>';return;}
        el.innerHTML=data.map(function(r,i){
            var name=r.model?(r.brand+'/'+r.model):(r.brand||'-');
            var diff=r.tp-r.yp,cls=diff>0?'is-up':diff<0?'is-down':'';
            var tag=diff>0?'<span class="price-tag is-up">涨</span>':diff<0?'<span class="price-tag is-down">降</span>':'';
            var old=diff!==0?'<div class="price-old">'+fmt(r.yp)+'</div>':'';
            var badge='<span class="origin-badge">'+getKw(r)+'</span>';
            return '<div class="price-card '+cls+'" style="animation-delay:'+delay(i,0.03)+'"><div class="card-left"><div class="card-name">'+name+'</div><div class="card-bottom-row"><span class="card-spec">'+(r.spec||'-')+'</span>'+badge+'</div></div><div class="card-right"><div class="price-today '+cls+'">'+fmt(r.tp)+'</div>'+old+tag+'</div></div>';
        }).join('');
    }

    function renderTable(data){
        var tbody=document.getElementById('tableBody');
        if(!data.length){tbody.innerHTML='<tr><td colspan="4"><div class="empty"><div class="empty-icon">◇</div><div class="empty-text">暂无相关数据</div></div></td></tr>';return;}
        tbody.innerHTML=data.map(function(r,i){
            var name=r.model?(r.brand+'/'+r.model):(r.brand||'-');
            var diff=r.tp-r.yp,cls=diff>0?'is-up':diff<0?'is-down':'';
            var tag=diff>0?'<span class="arrow-tag is-up">↑ 涨</span>':diff<0?'<span class="arrow-tag is-down">↓ 降</span>':'';
            var badge='<span class="origin-badge">'+getKw(r)+'</span>';
            return '<tr style="animation-delay:'+delay(i,0.025)+'"><td><span class="td-name">'+name+'</span>'+badge+'</td><td><span class="td-spec">'+(r.spec||'-')+'</span></td><td class="td-yp">'+fmt(r.yp)+'</td><td class="td-tp '+cls+'">'+fmt(r.tp)+tag+'</td></tr>';
        }).join('');
    }

    var searchTimer=null;
    document.getElementById('searchInput').addEventListener('input',function(e){
        var v=e.target.value.trim();
        clearTimeout(searchTimer);
        searchTimer=setTimeout(function(){searchTerm=v;render();},150);
    });
    document.getElementById('changeBtn').addEventListener('click',function(){onlyChanged=!onlyChanged;this.classList.toggle('active');render();});

    init();
})();
</script>
</body>
</html>
