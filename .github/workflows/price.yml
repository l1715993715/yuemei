name: 更新价格数据

on:
  schedule:
    - cron: '09 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install aiohttp

      - name: 拉取价格数据
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: python3 爬虫.py

      - name: 提交更新
        run: |
          git config user.name "price-bot"
          git config user.email "bot@yuemei.store"
          git add data.json
          git diff --cached --quiet || git commit -m "🔄 自动更新价格数据 $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
